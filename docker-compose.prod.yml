services:
  web:
    environment:
      COOKIE_SECURE: "true"
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      web: {condition: service_healthy}
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    networks: [management]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    restart: unless-stopped
