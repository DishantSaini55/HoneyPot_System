name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r apps/api/requirements.txt -r apps/worker/requirements.txt -r apps/ssh-honeypot/requirements.txt -r apps/http-honeypot/requirements.txt -r ml/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm audit --omit=dev
        working-directory: apps/web
      - uses: gitleaks/gitleaks-action@v2
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t honeypot-api:scan .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: honeypot-api:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
